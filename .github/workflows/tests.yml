name: Project tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numerical test dependency
        run: python -m pip install numpy==2.3.5
      - name: Run package and scientific validation tests
        run: make test PYTHON=python
      # Hand-calculated month-factor and timing cases run without the full data.
      # Full data replay is run from the release archive.
